<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>미니게임 포레스트에 초대받았어요!</title>
<meta name="description" content="게임을 플레이하고 3,000코인을 획득하세요!">
<!-- what messengers show with the link: the picture, the title, the line under it -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="미니게임 포레스트">
<meta property="og:title" content="미니게임 포레스트에 초대받았어요!">
<meta property="og:description" content="게임을 플레이하고 3,000코인을 획득하세요!">
<meta property="og:image" content="https://block-forest.vercel.app/invite-card-ko.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
  :root { --ol: #2b1a0e; }
  html, body { margin: 0; height: 100%; }
  body { background: #5aa65a url(splash-ko-tall.webp) center top / cover no-repeat; font-family: 'Do Hyeon', sans-serif; color: var(--ol);
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center; min-height: 100vh; min-height: 100dvh; box-sizing: border-box;
    padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 22px); }
  .card { width: 100%; max-width: 420px; box-sizing: border-box; background: #fff6dc; border: 4px solid var(--ol); border-radius: 26px; box-shadow: 0 6px 0 var(--ol);
    padding: 18px 18px 20px; text-align: center; }
  h1 { margin: 0 0 8px; font-weight: 400; font-size: clamp(20px, 6vw, 25px); line-height: 1.25; }
  p { margin: 0 0 16px; font-size: clamp(16px, 4.6vw, 19px); line-height: 1.35; color: #6b4a2c; }
  p em { font-style: normal; color: #e07a10; }
  a.btn { display: flex; align-items: center; justify-content: center; min-height: 58px; border: 4px solid var(--ol); border-radius: 18px; box-shadow: 0 5px 0 var(--ol);
    background: linear-gradient(#8fe063, #4fb83f); color: #fff; -webkit-text-stroke: 6px var(--ol); paint-order: stroke fill; font-size: 23px; text-decoration: none; }
  a.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ol); }
  a[hidden] { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>친구가 미니게임 포레스트에<br>초대했어요!</h1>
  <p>앱을 깔고 1판만 하면<br>친구도 나도 <em>3,000코인</em>!</p>
  <a class="btn" id="store" href="#" hidden>Google Play에서 받기</a>
  <a class="btn" id="web" href="./">웹에서 바로 하기</a>
</div>
<script>
  // STORE_LIVE: the app is on Google Play (then an Android phone goes straight there, with who invited in the link's
  // referrer for the app to read; until then the web game, with who invited in ?inv=)
  const STORE_LIVE = false;
  const u = new URLSearchParams(location.search).get('u') || '', ok = /^[A-Za-z0-9]{1,128}$/.test(u);
  const store = 'https://play.google.com/store/apps/details?id=com.wonkyu.minigameforest' + (ok ? '&referrer=' + encodeURIComponent('inv=' + u) : '');
  const st = document.getElementById('store'), web = document.getElementById('web');
  st.href = store; web.href = './' + (ok ? '?inv=' + encodeURIComponent(u) : '');
  st.hidden = !STORE_LIVE; web.hidden = STORE_LIVE;
  if (STORE_LIVE && /Android/i.test(navigator.userAgent)) location.replace(store);
</script>
</body>
</html>
